title = "Custom Gitleaks Config for Secrets Detection"
version = "2"

[[path.allowlist]]
description = "Solo analizar el directorio app"
path = "app/"

[[rules]]
id = "env-generic-keys"
description = "Detect generic env-style secrets"
regex = '''(?i)(password|pass|pwd|secret|token|api[_-]?key|access[_-]?key|aws[_-]?secret|azure[_-]?secret)[\s:=]+[A-Za-z0-9+/=]{4,}'''
tags = ["key", "env", "custom"]

[[rules]]
id = "base64-high-entropy"
description = "Detect high-entropy base64 strings"
regex = '''([A-Za-z0-9+/]{20,}={0,2})'''
entropy = 4.5
tags = ["base64", "entropy"]

[[rules]]
id = "jwt"
description = "Detect JWT tokens"
regex = '''eyJ[a-zA-Z0-9-_=]+?\.[a-zA-Z0-9-_=]+?\.([a-zA-Z0-9-_.+/=]*)?'''
tags = ["token", "jwt"]

[[rules]]
id = "aws-secret-key"
description = "AWS Secret Key"
regex = '''(?i)aws(.{0,20})?['\"][0-9a-zA-Z/+]{40}['\"]'''
tags = ["aws", "secret"]

[[rules]]
id = "azure-storage-key"
description = "Azure Storage Key"
regex = '''(?i)(azure(.{0,20})?(key|secret))\s*=\s*["']?[A-Za-z0-9+/=]{32,}["']?'''
tags = ["azure", "secret"]

[[rules]]
id = "slack-token"
description = "Slack Token"
regex = '''xox[baprs]-[0-9]{12}-[0-9]{12}-[a-zA-Z0-9]{24}'''
tags = ["slack", "token"]

[allowlist]
description = "Whitelist"
paths = []
regexes = [
  '''(?i)example|dummy|fake|sample|test'''
]
